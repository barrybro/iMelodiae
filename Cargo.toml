[package]
name = "imelodiae"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
dirs = "7.0.0"
gstreamer = "0.25"
lofty = "0.25"
notify = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }
walkdir = "2.5.0"

[build-dependencies]
cxx-qt-build = "0.10"
